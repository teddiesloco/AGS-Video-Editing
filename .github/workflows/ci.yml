name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt -r requirements-mcp.txt
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'ags_test_*.py'
